services:
  ssh-connect:
    build: .
    container_name: ssh-connect
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to at least 12 characters}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Optional Google login. Needs both client credentials and an allow list.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
    volumes:
      - ssh-connect-data:/app/data
    restart: unless-stopped

volumes:
  ssh-connect-data:
