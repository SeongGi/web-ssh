services:
  web-ssh:
    image: ghcr.io/seonggi/web-ssh:latest
    container_name: web-ssh
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to at least 12 characters}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - web-ssh-data:/app/data
    restart: unless-stopped

volumes:
  web-ssh-data:
