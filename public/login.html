<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - Web-SSH Portal</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css?v=14">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-gradient);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 1.5rem;
    }
    .login-card {
      backdrop-filter: blur(16px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: var(--glass-shadow), 0 0 40px rgba(139, 92, 246, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      animation: zoomIn 0.3s ease-out;
    }
    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .login-logo {
      background: var(--primary-gradient);
      width: 56px;
      height: 56px;
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--primary-glow);
    }
    .login-logo i {
      color: #fff;
      width: 28px;
      height: 28px;
    }
    .login-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-header p {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--color-offline);
      border-radius: var(--border-radius-md);
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: shake 0.3s ease;
    }
    .google-btn {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #ffffff;
      color: #1f1f1f;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: var(--border-radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .google-btn:hover {
      filter: brightness(0.96);
    }
    .google-btn:active {
      transform: scale(0.99);
    }
    .google-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i data-lucide="shield-alert"></i>
        </div>
        <h2 id="portal-title-text">Web-SSH Portal</h2>
        <p>허용된 Google 계정으로만 로그인할 수 있습니다.</p>
      </div>

      <div id="error-container" class="error-msg hidden">
        <i data-lucide="alert-circle" style="width:16px;height:16px"></i>
        <span id="error-text">로그인에 실패했습니다.</span>
      </div>

      <a href="/api/auth/google" class="google-btn">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        <span>Google 계정으로 로그인</span>
      </a>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const errorContainer = document.getElementById('error-container');
    const errorText = document.getElementById('error-text');

    function showError(message) {
      errorText.innerText = message;
      errorContainer.classList.remove('hidden');
      lucide.createIcons();
    }

    // Load the portal name from the config API
    async function loadPortalConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const data = await res.json();
          const name = data.portalName || 'Web-SSH Portal';
          document.title = `Login - ${name}`;
          document.getElementById('portal-title-text').innerText = name;
        }
      } catch (e) {
        console.warn('Failed to load portal config:', e);
      }
    }
    loadPortalConfig();

    // Surface failures reported by the Google OAuth callback
    const GOOGLE_ERRORS = {
      google_denied: 'Google 로그인이 취소되었습니다.',
      google_state: 'Google 로그인 요청이 만료되었거나 유효하지 않습니다. 다시 시도해 주세요.',
      google_token: 'Google 인증 서버와 토큰을 교환하지 못했습니다.',
      google_forbidden: '허용 목록에 없는 Google 계정입니다. 관리자에게 문의하세요.',
      google_failed: 'Google 로그인 처리 중 오류가 발생했습니다.'
    };

    const loginError = new URLSearchParams(window.location.search).get('error');
    if (loginError) {
      showError(GOOGLE_ERRORS[loginError] || '로그인에 실패했습니다.');
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
</body>
</html>
